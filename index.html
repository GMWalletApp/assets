<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080a0f" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Browse GMWallet token, network, exchange, wallet, dapp, and swap-provider assets."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>GMWallet Asset Atlas</title>
    <script>
      (() => {
        try {
          const value = localStorage.getItem("gmwallet-assets-theme") || "system";
          const dark =
            value === "dark" ||
            (value === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
