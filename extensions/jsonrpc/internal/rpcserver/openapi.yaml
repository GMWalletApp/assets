openapi: 3.1.0
info:
  title: Sparkdance Managed Lists API
  version: 1.0.0
  description: |
    CRUD API for multi-chain token lists. A list detail is one aggregate document
    containing list-level presentation settings and its managed items. Item routes
    remain available for independent editing. Administrative authentication is
    expected to be enforced by the deployment proxy (for example, Caddy basic_auth).
servers:
  - url: /
tags:
  - name: Lists
  - name: Items
  - name: Support
  - name: Pack
  - name: Published Files
paths:
  /api/lists:
    get:
      tags: [Lists]
      operationId: listManagedLists
      summary: List all managed-list summaries
      security: [{basicAuth: []}]
      responses:
        '200':
          description: List summaries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ManagedList'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Lists]
      operationId: createManagedList
      summary: Create a list
      security: [{basicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListCreate'}
      responses:
        '201':
          description: Created list aggregate
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedListAggregate'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/lists/{listKey}:
    parameters:
      - $ref: '#/components/parameters/ListKey'
    get:
      tags: [Lists]
      operationId: getManagedList
      summary: Get list metadata and all managed items
      security: [{basicAuth: []}]
      responses:
        '200':
          description: Complete management document
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedListAggregate'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      tags: [Lists]
      operationId: replaceManagedList
      summary: Replace a list or create it at this key
      security: [{basicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListReplace'}
      responses:
        '200':
          description: Replaced list aggregate
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedListAggregate'}
        '201':
          description: Created list aggregate
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedListAggregate'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      tags: [Lists]
      operationId: patchManagedList
      summary: Modify individual list-level fields
      description: The list key is immutable. Omitted fields are preserved.
      security: [{basicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListPatch'}
      responses:
        '200':
          description: Updated list aggregate
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedListAggregate'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Lists]
      operationId: deleteManagedList
      summary: Delete a list and its memberships
      security: [{basicAuth: []}]
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/lists/{listKey}/items:
    parameters:
      - $ref: '#/components/parameters/ListKey'
    get:
      tags: [Items]
      operationId: listManagedListItems
      summary: List independently editable items
      security: [{basicAuth: []}]
      responses:
        '200':
          description: Managed items
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ManagedListItem'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Items]
      operationId: createManagedListItem
      summary: Add a new item to a list
      description: |
        Existing repository metadata is hydrated when chain and address match a
        local asset. A complete ManagedListItem returned by tokenlist, homepage,
        a stablecoin family, or any other list can be posted unchanged here;
        response timestamps are accepted but ignored and regenerated.
      security: [{basicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ItemCreate'}
      responses:
        '201':
          description: Created item
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedListItem'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/lists/{listKey}/items/{chain}/{address}:
    parameters:
      - $ref: '#/components/parameters/ListKey'
      - $ref: '#/components/parameters/Chain'
      - $ref: '#/components/parameters/Address'
    get:
      tags: [Items]
      operationId: getManagedListItem
      summary: Get one managed item
      security: [{basicAuth: []}]
      responses:
        '200':
          description: Managed item
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedListItem'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      tags: [Items]
      operationId: replaceManagedListItem
      summary: Replace an item or create it at this identity
      description: token.chain and token.address, when supplied, must match the path.
      security: [{basicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ItemReplace'}
      responses:
        '200':
          description: Replaced item
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedListItem'}
        '201':
          description: Created item
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedListItem'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      tags: [Items]
      operationId: patchManagedListItem
      summary: Modify individual item or token metadata fields
      description: Omitted fields are preserved. Token chain and address are immutable.
      security: [{basicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ItemPatch'}
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedListItem'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Items]
      operationId: deleteManagedListItem
      summary: Remove an item from a list
      security: [{basicAuth: []}]
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/lists/{listKey}/includes:
    parameters:
      - $ref: '#/components/parameters/ListKey'
    get:
      tags: [Lists]
      operationId: listManagedListIncludes
      summary: List source lists expanded into a target list
      security: [{basicAuth: []}]
      responses:
        '200':
          description: Ordered list includes
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ManagedListInclude'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Lists]
      operationId: createManagedListInclude
      summary: Include another managed list by tag
      description: The tag is the source list key and becomes the slot on every expanded packed item.
      security: [{basicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListIncludeCreate'}
      responses:
        '201':
          description: Created include
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedListInclude'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/lists/support/{supportCategory}:
    parameters:
      - $ref: '#/components/parameters/SupportCategory'
    get:
      tags: [Support]
      operationId: listSupportEntries
      summary: List managed exchanges or wallets
      security: [{basicAuth: []}]
      responses:
        '200':
          description: Ordered support entries, including disabled entries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ManagedSupportEntry'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Support]
      operationId: createSupportEntry
      summary: Add an exchange or wallet
      security: [{basicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupportEntryCreate'}
      responses:
        '201':
          description: Created support entry
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedSupportEntry'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/lists/support/{supportCategory}/{supportEntryId}:
    parameters:
      - $ref: '#/components/parameters/SupportCategory'
      - $ref: '#/components/parameters/SupportEntryId'
    get:
      tags: [Support]
      operationId: getSupportEntry
      summary: Get one managed exchange or wallet
      security: [{basicAuth: []}]
      responses:
        '200':
          description: Support entry
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedSupportEntry'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      tags: [Support]
      operationId: replaceSupportEntry
      summary: Replace a support entry or create it at this id
      security: [{basicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupportEntryReplace'}
      responses:
        '200':
          description: Replaced support entry
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedSupportEntry'}
        '201':
          description: Created support entry
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedSupportEntry'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      tags: [Support]
      operationId: patchSupportEntry
      summary: Modify individual support-entry fields
      description: The entry id is immutable. Omitted fields are preserved.
      security: [{basicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupportEntryPatch'}
      responses:
        '200':
          description: Updated support entry
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedSupportEntry'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Support]
      operationId: deleteSupportEntry
      summary: Delete an exchange or wallet
      security: [{basicAuth: []}]
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/lists/{listKey}/includes/{tag}:
    parameters:
      - $ref: '#/components/parameters/ListKey'
      - $ref: '#/components/parameters/IncludeTag'
    get:
      tags: [Lists]
      operationId: getManagedListInclude
      summary: Get one list include
      security: [{basicAuth: []}]
      responses:
        '200':
          description: List include
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedListInclude'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      tags: [Lists]
      operationId: replaceManagedListInclude
      summary: Replace an include or create it at this tag
      security: [{basicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListIncludeReplace'}
      responses:
        '200':
          description: Replaced include
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedListInclude'}
        '201':
          description: Created include
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedListInclude'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      tags: [Lists]
      operationId: patchManagedListInclude
      summary: Change include rank or enabled state
      security: [{basicAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListIncludePatch'}
      responses:
        '200':
          description: Updated include
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedListInclude'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Lists]
      operationId: deleteManagedListInclude
      summary: Stop including a source list
      security: [{basicAuth: []}]
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/pack/{listKey}:
    parameters:
      - $ref: '#/components/parameters/ListKey'
    post:
      tags: [Pack]
      operationId: packManagedList
      summary: Build one aggregate JSON and zstd list artifact
      security: [{basicAuth: []}]
      responses:
        '200':
          description: Generated artifact metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackFile'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/pack/all:
    post:
      tags: [Pack]
      operationId: packAllManagedLists
      summary: Build all enabled lists and the manifest
      security: [{basicAuth: []}]
      responses:
        '200':
          description: Generated manifest
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackManifest'}
        '500': {$ref: '#/components/responses/InternalError'}
  /files/{outputName}.json:
    parameters:
      - $ref: '#/components/parameters/OutputName'
    get:
      tags: [Published Files]
      operationId: downloadPackedListJSON
      summary: Download a public aggregate list as JSON
      description: |
        Generated by POST /api/pack/{listKey} or POST /api/pack/all. outputName
        comes from the list's outputPath (without the final .json), so it does not
        have to equal listKey. Use jsonUrl from PackFile or manifest.json as the
        authoritative public URL. An outputPath containing subdirectories adds
        those path segments below /files/.
      responses:
        '200':
          description: Packed list document
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PackedListDocument'
                  - $ref: '#/components/schemas/PublishedSupportDocument'
        '404': {$ref: '#/components/responses/NotFound'}
  /files/{outputName}.json.zst:
    parameters:
      - $ref: '#/components/parameters/OutputName'
    get:
      tags: [Published Files]
      operationId: downloadPackedListZstd
      summary: Download the Zstandard-compressed aggregate list
      description: Use zstdUrl from PackFile or manifest.json as the authoritative public URL.
      responses:
        '200':
          description: Zstandard-compressed bytes of the corresponding JSON document
          content:
            application/zstd:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/NotFound'}
  /files/manifest.json:
    get:
      tags: [Published Files]
      operationId: downloadPackManifest
      summary: Download the public artifact manifest
      responses:
        '200':
          description: Pack manifest
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackManifest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /openapi.yaml:
    get:
      tags: [Published Files]
      operationId: downloadOpenAPI
      summary: Download this OpenAPI 3.1 contract
      responses:
        '200':
          description: OpenAPI YAML
          content:
            application/yaml:
              schema: {type: string}
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Authentication is provided by the deployment proxy.
  parameters:
    ListKey:
      name: listKey
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]*$'
      example: usdt
    OutputName:
      name: outputName
      in: path
      required: true
      description: The configured outputPath without its final `.json`; this can differ from listKey.
      schema: {type: string, minLength: 1}
      example: usdt
    Chain:
      name: chain
      in: path
      required: true
      schema: {type: string, minLength: 1}
      example: ethereum
    Address:
      name: address
      in: path
      required: true
      description: Contract address or the literal `native` for a native asset.
      schema: {type: string, minLength: 1}
      example: 0xdAC17F958D2ee523a2206206994597C13D831ec7
    IncludeTag:
      name: tag
      in: path
      required: true
      description: Source managed-list key and packed item slot.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]*$'
      example: usdt
    SupportCategory:
      name: supportCategory
      in: path
      required: true
      schema: {type: string, enum: [exchanges, wallets]}
      example: wallets
    SupportEntryId:
      name: supportEntryId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]*$'
      example: metamask
  responses:
    InvalidRequest:
      description: Invalid JSON, unknown field, validation error, or path/body mismatch
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    ManagedList:
      type: object
      required: [key, enabled]
      properties:
        key: {type: string}
        name: {type: string}
        description: {type: string}
        displayName: {type: string}
        displaySymbol: {type: string}
        logoURI: {type: string, format: uri}
        outputPath: {type: string, description: Portable relative JSON path using forward-slash separators; unique across lists.}
        enabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ManagedListDocument:
      allOf:
        - $ref: '#/components/schemas/ManagedList'
        - type: object
          required: [includes, items]
          properties:
            includes:
              type: array
              items: {$ref: '#/components/schemas/ManagedListInclude'}
            items:
              type: array
              items: {$ref: '#/components/schemas/ManagedListItem'}
    ManagedListAggregate:
      oneOf:
        - $ref: '#/components/schemas/ManagedListDocument'
        - $ref: '#/components/schemas/ManagedSupportDocument'
    ManagedSupportDocument:
      allOf:
        - $ref: '#/components/schemas/ManagedList'
        - type: object
          required: [schemaVersion, assetBaseURI, exchanges, wallets]
          properties:
            schemaVersion: {type: integer, const: 1}
            assetBaseURI: {type: string, format: uri}
            exchanges:
              type: array
              items: {$ref: '#/components/schemas/ManagedSupportEntry'}
            wallets:
              type: array
              items: {$ref: '#/components/schemas/ManagedSupportEntry'}
    ManagedSupportEntry:
      type: object
      required: [id, name, logoURI, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        type: {type: string, enum: [cex, dex], description: Required for exchanges and omitted for wallets.}
        logoURI: {type: string, format: uri}
        rank: {type: integer, minimum: 0}
        enabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SupportEntryCreate:
      type: object
      additionalProperties: false
      required: [id, name, logoURI]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9._-]*$'}
        name: {type: string, minLength: 1}
        type: {type: string, enum: [cex, dex], description: Also required when supportCategory is exchanges.}
        logoURI: {type: string, format: uri}
        rank: {type: integer, minimum: 0}
        enabled: {type: boolean, default: true}
        createdAt: {type: string, format: date-time, description: Accepted and ignored on write.}
        updatedAt: {type: string, format: date-time, description: Accepted and ignored on write.}
    SupportEntryReplace:
      type: object
      additionalProperties: false
      required: [name, logoURI]
      properties:
        id: {type: string, description: If present, must match supportEntryId.}
        name: {type: string, minLength: 1}
        type: {type: string, enum: [cex, dex], description: Also required when supportCategory is exchanges.}
        logoURI: {type: string, format: uri}
        rank: {type: integer, minimum: 0}
        enabled: {type: boolean, default: true}
        createdAt: {type: string, format: date-time, description: Accepted and ignored on write.}
        updatedAt: {type: string, format: date-time, description: Accepted and ignored on write.}
    SupportEntryPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1}
        type: {type: string, enum: [cex, dex], description: Valid only for exchanges.}
        logoURI: {type: string, format: uri}
        rank: {type: integer, minimum: 0}
        enabled: {type: boolean}
    PublishedSupportDocument:
      type: object
      required: [schemaVersion, assetBaseURI, exchanges, wallets]
      properties:
        schemaVersion: {type: integer, const: 1}
        assetBaseURI: {type: string, format: uri}
        exchanges:
          type: array
          items: {$ref: '#/components/schemas/PublishedSupportEntry'}
        wallets:
          type: array
          items: {$ref: '#/components/schemas/PublishedSupportEntry'}
    PublishedSupportEntry:
      type: object
      required: [id, name, logoURI]
      properties:
        id: {type: string}
        name: {type: string}
        type: {type: string, enum: [cex, dex]}
        logoURI: {type: string, format: uri}
    ManagedListInclude:
      type: object
      required: [tag, enabled]
      properties:
        tag: {type: string, description: Source managed-list key and packed item slot.}
        rank: {type: integer, minimum: 0, description: Group rank applied to expanded items; zero preserves source ranks.}
        enabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ListIncludeCreate:
      type: object
      additionalProperties: false
      required: [tag]
      properties:
        tag: {type: string, pattern: '^[a-z0-9][a-z0-9._-]*$'}
        rank: {type: integer, minimum: 0}
        enabled: {type: boolean, default: true}
        createdAt: {type: string, format: date-time, description: Accepted and ignored on write.}
        updatedAt: {type: string, format: date-time, description: Accepted and ignored on write.}
    ListIncludeReplace:
      type: object
      additionalProperties: false
      properties:
        tag: {type: string, description: If present, must match the path tag.}
        rank: {type: integer, minimum: 0}
        enabled: {type: boolean, default: true}
